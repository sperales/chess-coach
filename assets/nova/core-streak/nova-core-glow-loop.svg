<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Núcleo de Nova activo">

  <defs>
    <radialGradient id="activeCenter" cx="38%" cy="34%">
      <stop offset="0" stop-color="#ffffee"/>
      <stop offset=".32" stop-color="#d8ff55"/>
      <stop offset="1" stop-color="#9bdd00"/>
    </radialGradient>
    <linearGradient id="activeRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d1ff3e"/>
      <stop offset=".55" stop-color="#9bdd00"/>
      <stop offset="1" stop-color="#638f00"/>
    </linearGradient>
    <filter id="greenGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feFlood flood-color="#9bdd00" flood-opacity=".8"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    #center { transform-origin:64px 64px; animation:core-breathe 2.4s ease-in-out infinite; }
    #halo { transform-origin:64px 64px; animation:halo-breathe 2.4s ease-in-out infinite; }
    @keyframes core-breathe {
      0%,100%{transform:scale(.97);filter:brightness(.96)}
      50%{transform:scale(1.025);filter:brightness(1.12)}
    }
    @keyframes halo-breathe {
      0%,100%{opacity:.27;transform:scale(.94)}
      50%{opacity:.58;transform:scale(1.06)}
    }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } #halo{opacity:.38} }
  </style>
  <circle id="halo" cx="64" cy="64" r="38" fill="#9bdd00" opacity=".27" filter="url(#greenGlow)"/>
  <circle cx="64" cy="64" r="49" fill="#0b0f0e"/>
  <circle cx="64" cy="64" r="45.5" fill="url(#activeRing)"/>
  <circle cx="64" cy="64" r="39" fill="#272e2b"/>
  <circle cx="64" cy="64" r="35.5" fill="url(#activeRing)"/>
  <circle cx="64" cy="64" r="29" fill="#1d2320"/>
  <circle id="center" cx="64" cy="64" r="22.5" fill="url(#activeCenter)"/>
</svg>
